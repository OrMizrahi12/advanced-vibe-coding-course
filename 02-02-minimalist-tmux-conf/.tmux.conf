# Minimalist AI Operator .tmux.conf

# --- 1. Ergonomics, Splits & Vim Navigation ---
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 2. Scrollback & Mouse Control ---
set -g history-limit 50000
set -g mouse on

# --- 3. Visual Pane Identity & Matrix HUD ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g pane-border-status top
set -g pane-border-style "fg=#223028"
set -g pane-active-border-style "fg=#20F86C"
set -g pane-border-format " #[fg=#20F86C,bold]#{pane_index}: #{pane_title} "

set -g status-style "bg=#0B0E0C,fg=#83948A"
set -g status-left "#[fg=#20F86C,bold] #S #[fg=#223028]| "
set -g status-left-length 30
set -g status-right "#[fg=#83948A]#{b:pane_current_path} "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#20F86C,bold] #I:#W "
set -g message-style "bg=#0B0E0C,fg=#20F86C,bold"

# --- 4. Zero-Friction Live Reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
