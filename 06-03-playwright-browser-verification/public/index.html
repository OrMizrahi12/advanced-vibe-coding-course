<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShipPulse Feature Votes</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0E0C;color:#EEF2EF;font:26px/1.4 system-ui,sans-serif}
    main{width:820px}
    h1{margin:0 0 24px;font-size:44px;letter-spacing:-0.02em}
    .card{background:#121714;border:1px solid #223028;border-radius:16px;padding:30px 32px;display:flex;justify-content:space-between;align-items:center}
    button{background:#20F86C;color:#0B0E0C;border:0;border-radius:12px;padding:16px 28px;font:700 26px system-ui,sans-serif;cursor:pointer}
    .meta{color:#83948A;font-size:22px;margin-top:6px}
  </style>
</head>
<body>
  <main>
    <h1>ShipPulse Feature Votes</h1>
    <div class="card">
      <div><strong>Live Stream Logs</strong><div class="meta">Terminal agent feed</div></div>
      <button id="upvote-btn" data-id="dark-logs">Upvote <span id="vote-count">42</span></button>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
